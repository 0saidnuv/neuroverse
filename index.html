<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEUROVERSE: THE LAST CHALLENGE</title>
  <meta name="description" content="Videojuego educativo transversal — COBAO Plantel 61, grupo 102.">
  <meta name="theme-color" content="#07061a">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpolygon points='32,3 58,18 58,46 32,61 6,46 6,18' fill='%2307061a' stroke='%238b5cf6' stroke-width='5'/%3E%3Ccircle cx='32' cy='32' r='9' fill='%2322d3ee'/%3E%3C/svg%3E">
  <!-- Fuentes (si no hay internet, el juego usa fuentes del sistema automáticamente) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Exo+2:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/arcade.css">
</head>
<body>
  <canvas id="bg-canvas" aria-hidden="true"></canvas>
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="bg-vignette" aria-hidden="true"></div>

  <div id="app">
    <!-- Barra superior -->
    <header id="topbar" class="hidden">
      <button class="brand" data-action="menu" title="Menú principal">
        <span class="brand-logo" data-logo="mini"></span>
        <span class="brand-text">NEUROVERSE</span>
      </button>
      <div class="topbar-center" id="topbar-status"></div>
      <div class="topbar-actions">
        <span class="chip chip-local" title="El juego funciona sin internet. El multijugador online aún no está implementado.">● MODO LOCAL</span>
        <button class="icon-btn" id="btn-music" data-action="toggle-music" title="Música (M)">♫</button>
        <button class="icon-btn" id="btn-sfx" data-action="toggle-sfx" title="Efectos de sonido (S)">🔊</button>
        <button class="icon-btn" id="btn-projector" data-action="toggle-projector" title="Modo proyector: texto grande">⛶</button>
        <button class="icon-btn" data-action="fullscreen" title="Pantalla completa (F)">⤢</button>
        <button class="icon-btn" data-action="manual" title="Manual">?</button>
        <button class="icon-btn host-btn" data-action="admin" title="Panel del anfitrión">⚙</button>
      </div>
    </header>

    <main id="screens">
      <!-- 1. INICIO -->
      <section class="screen" id="s-splash" aria-label="Pantalla de inicio">
        <div class="splash-inner">
          <div class="splash-logo" data-logo="big"></div>
          <h1 class="logo-title"><span class="glitch" data-text="NEUROVERSE">NEUROVERSE</span></h1>
          <div class="logo-sub">THE LAST CHALLENGE</div>
          <p class="logo-motto">Cada decisión cuenta. Cada conocimiento te acerca a la victoria.</p>
          <button class="btn btn-primary btn-xl pulse" data-action="start">PRESIONA PARA INICIAR</button>
          <div class="splash-foot">COBAO · Plantel 61 · Grupo 102 · Proyecto transversal · Oaxaca, México</div>
        </div>
      </section>

      <!-- 2. MENÚ PRINCIPAL -->
      <section class="screen" id="s-menu" aria-label="Menú principal"></section>
      <!-- 3. SELECCIÓN DE MODO -->
      <section class="screen" id="s-mode" aria-label="Selección de modo"></section>
      <!-- 4. REGISTRO -->
      <section class="screen" id="s-register" aria-label="Registro de jugadores y equipos"></section>
      <!-- 5. MAPA DE MUNDOS -->
      <section class="screen" id="s-map" aria-label="Mapa de mundos"></section>
      <!-- 6. MISIONES -->
      <section class="screen" id="s-missions" aria-label="Selección de misiones"></section>
      <!-- 7. PREGUNTAS (también duelos) -->
      <section class="screen" id="s-question" aria-label="Pregunta"></section>
      <!-- 8. RETOS ESPECIALES -->
      <section class="screen" id="s-special" aria-label="Reto especial"></section>
      <!-- 9. JEFES FINALES -->
      <section class="screen" id="s-boss" aria-label="Jefe final"></section>
      <!-- 10. RESULTADOS -->
      <section class="screen" id="s-results" aria-label="Resultados"></section>
      <!-- 11. RANKING -->
      <section class="screen" id="s-ranking" aria-label="Ranking"></section>
      <!-- 12. ADMINISTRACIÓN -->
      <section class="screen" id="s-admin" aria-label="Panel de administración"></section>
      <!-- 13. MANUAL -->
      <section class="screen" id="s-manual" aria-label="Manual de instrucciones"></section>
      <!-- EXPANSIÓN: NEUROVERSE ARCADE -->
      <section class="screen" id="s-arcade" aria-label="NEUROVERSE Arcade"></section>
      <section class="screen" id="s-arcade-game" aria-label="Minijuego"></section>
    </main>
  </div>

  <!-- Capas superpuestas -->
  <div id="ov-countdown" class="overlay hidden" aria-live="assertive"><div class="cd-label"></div><div class="cd-num"></div></div>
  <div id="ov-transition" class="overlay hidden"><div class="tr-inner"></div></div>
  <div id="ov-modal" class="overlay hidden" role="dialog" aria-modal="true"><div class="modal"></div></div>
  <div id="toasts" aria-live="polite"></div>
  <div id="flash" aria-hidden="true"></div>
  <canvas id="fx-canvas" aria-hidden="true"></canvas>

  <!-- Código: datos, motor, interfaz -->
  <script src="js/data/worlds.js"></script>
  <script src="js/data/questions.js"></script>
  <script src="js/data/challenges.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/network.js"></script>
  <script src="js/pwa.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/screens.js"></script>
  <script src="js/arcade/arcade.js"></script>
  <script src="js/arcade/games1.js"></script>
  <script src="js/arcade/games2.js"></script>
  <script src="js/arcade/games3.js"></script>
  <script src="js/match.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
